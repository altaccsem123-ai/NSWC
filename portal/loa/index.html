<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>NSWC LOA</title><link rel="stylesheet" href="../shared/portal-shell.css"></head><body>
<header class="topbar"><div class="topbar-inner"><div class="brand">NAVAL SPECIAL WARFARE COMMAND<small>2012 PERSONNEL SYSTEM // LEAVE OF ABSENCE</small></div><div class="identity"><strong data-identity-name>...</strong><span data-identity-meta>...</span></div></div></header>
<nav class="nav"><div class="nav-inner"><a href="../app/">Scheduling</a><a href="../orbat/">ORBAT</a><a class="active" href="../loa/">LOA</a><a href="../profile/">Profile</a><a href="../admin/">Admin</a><a href="#" data-logout>Sign out</a></div></nav>
<main class="shell"><div class="page-head"><div><h1>Leave of Absence</h1><p>Submit planned absences. Team Leaders and HQ personnel review pending requests.</p></div><button id="new-btn" class="button primary">Submit LOA</button></div>
<div class="grid grid-2"><section class="panel"><div class="panel-head">My Requests</div><div id="mine" class="panel-body"></div></section><section id="review-panel" class="panel" hidden><div class="panel-head">Pending Leadership Review</div><div id="review" class="panel-body"></div></section></div></main>
<dialog id="new-dialog" class="modal"><form id="new-form"><div class="modal-head">Submit Leave of Absence</div><div class="modal-body grid grid-2"><div class="field"><label>Start date</label><input type="date" name="start" required></div><div class="field"><label>End date</label><input type="date" name="end" required></div><div class="field" style="grid-column:1/-1"><label>Reason</label><textarea name="reason" required maxlength="1000"></textarea></div><div id="new-error" class="error"></div></div><div class="modal-foot"><button type="button" id="new-cancel" class="button">Cancel</button><button class="button primary">Submit request</button></div></form></dialog>
<dialog id="review-dialog" class="modal"><form id="review-form"><div class="modal-head">Review LOA</div><div class="modal-body"><div id="review-summary" class="notice"></div><div class="field" style="margin-top:12px"><label>Leadership note</label><textarea name="note" maxlength="1000"></textarea></div><div id="review-error" class="error"></div></div><div class="modal-foot"><button type="button" id="review-cancel" class="button">Cancel</button><button type="button" id="deny" class="button danger">Deny</button><button type="button" id="approve" class="button primary">Approve</button></div></form></dialog>
<script type="module" src="loa.js"></script></body></html>
